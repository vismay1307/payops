# Render Blueprint for PayOps
# Keep the API and PostgreSQL database in the same region.

databases:
  - name: payops-db
    region: oregon
    plan: free
    databaseName: payops_r17o
    user: payops

services:
  - type: web
    name: payops-api
    runtime: node
    region: oregon
    plan: free

    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @payops/api build
    startCommand: pnpm --filter @payops/api start
    healthCheckPath: /healthz
    preDeployCommand: cd apps/api && node dist/migrate.js

    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: PAYPAL_ENV
        value: sandbox
      - key: MIGRATION_TARGET
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: payops-db
          property: connectionString
